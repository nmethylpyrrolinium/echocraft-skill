<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tidewrite local</title></head>
<body>
  <main>
    <h1>Tidewrite</h1>
    <p>Entries stay on your device, in this browser's storage. Clearing site data removes them.</p>
    <label for="entry">Entry</label><textarea id="entry"></textarea>
    <button id="save">Save to this device</button>
    <button id="wipe">Remove entries from this device</button>
  </main>
  <script src="app.js"></script>
</body></html>
