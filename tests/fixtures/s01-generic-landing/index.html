<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plainledger - invoices without the busywork</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><a class="brand" href="/">Plainledger</a><nav aria-label="Primary"><a href="/pricing">Pricing</a> <a href="/docs">Docs</a></nav></header>
  <main>
    <h1>Send invoices in two clicks</h1>
    <p>Plainledger turns time entries into invoices and tracks who has paid.</p>
    <img src="/img/dashboard.png" alt="Invoice list showing three paid invoices and one overdue">
    <form action="/subscribe" method="post">
      <label for="email">Work email</label>
      <input id="email" name="email" type="email" required>
      <button type="submit">Start free trial</button>
    </form>
  </main>
</body>
